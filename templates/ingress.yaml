# ingress.yaml
#
# Requires the AWS Load Balancer Controller to be installed on the
# cluster first (it's what actually watches Ingress resources and
# provisions a real ALB) — see README for the install command, it's
# not automatic just because EKS exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: luxury-vault-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  rules:
    - host: 
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: {{ .Values.frontend.port }}
