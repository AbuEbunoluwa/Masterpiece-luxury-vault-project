apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Without this, a fresh deploy can crash-loop if the API container
      # starts before Postgres/Redis are actually accepting connections —
      # a very common real-world "why is it CrashLoopBackOff" cause,
      # worth having in place rather than discovering it during your
      # fault-injection phase for the wrong reason.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.NODE_ENV | quote }}
            - name: REDIS_HOST
              value: {{ .Values.api.env.REDIS_HOST | quote }}
            # DB_HOST is now a fixed in-cluster Service name (postgres-service),
            # set directly from values.yaml — no RDS endpoint to store since
            # Postgres runs in-cluster. Username/password still come from the
            # db-credentials Secret (see RUNBOOK.md — much simpler to create
            # now, just kubectl create secret with values you choose yourself).
            - name: DB_HOST
              value: {{ .Values.api.env.DB_HOST | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            - name: DB_NAME
              value: "luxuryvault"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
