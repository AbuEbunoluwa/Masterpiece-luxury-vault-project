version: '3.8'

# Local dev only — this is NOT what runs in production.
# In prod: Postgres is RDS, and the API runs as a pod in EKS.
# This just gives you a fast local loop before touching Kubernetes at all.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masterpiece_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: masterpiece_vault
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      JWT_SECRET: local-dev-secret-not-for-production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

volumes:
  pgdata:
